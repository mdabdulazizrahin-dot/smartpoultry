  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA (skip in Lovable preview/dev)
      if ('serviceWorker' in navigator && !/lovableproject\.com$|localhost|127\.0\.0\.1/.test(location.hostname)) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              registration.update();
              registration.addEventListener('updatefound', () => {
                const sw = registration.installing;
                if (!sw) return;
                sw.addEventListener('statechange', () => {
                  if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                    sw.postMessage('SKIP_WAITING');
                  }
                });
              });
            })
            .catch(() => {});
        });
        // Do not force full page reload on controller change
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          // New service worker activated smoothly without page reload
        });
      }
    </script>
  </body>
