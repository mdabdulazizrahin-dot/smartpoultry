<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15" flood-color="#000000" />
    </filter>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.25" flood-color="#10b981" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="850" fill="url(#bgGrad)" />

  <!-- Header Title -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff">
      স্মার্ট পোল্ট্রি • হেডারের ৪টি আধুনিক বাটন ডিজাইন
    </text>
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8">
      গেস্ট মোডে উপরের ডান পাশের বাটনের ৪টি আকর্ষণীয় ও বিশ্বমানের ডিজাইন বিকল্প
    </text>
  </g>

  <!-- VARIANT 1 -->
  <g transform="translate(60, 120)" filter="url(#shadow)">
    <rect width="1080" height="150" rx="16" fill="url(#cardGrad)" />
    
    <!-- Variant Label -->
    <rect x="25" y="18" width="130" height="26" rx="6" fill="#10b981" fill-opacity="0.15" />
    <text x="35" y="36" font-family="sans-serif" font-size="12" font-weight="700" fill="#059669">ডিজাইন ১: সলিড লগইন</text>
    <text x="170" y="36" font-family="sans-serif" font-size="12" fill="#64748b">পরিষ্কার, দৃষ্টি আকর্ষণকারী এবং একদম স্পষ্ট অ্যাকশন বাটন</text>

    <!-- Header Mockup Frame -->
    <g transform="translate(25, 55)">
      <rect width="1030" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      
      <!-- Brand Left -->
      <g transform="translate(16, 15)">
        <rect width="40" height="40" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
        <text x="10" y="27" font-size="20">🐔</text>
        <text x="50" y="20" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Smart Poultry</text>
        <rect x="155" y="8" width="55" height="18" rx="9" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1" />
        <text x="163" y="21" font-family="sans-serif" font-size="10" font-weight="600" fill="#047857">✓ সুরক্ষিত</text>
        <text x="50" y="36" font-family="sans-serif" font-size="11" fill="#64748b">আপনার খামারের হিসাব আজীবন নিরাপদ 🛡️</text>
      </g>

      <!-- Button Right (Variant 1: Solid Emerald Pill) -->
      <g transform="translate(860, 16)" filter="url(#glow)">
        <rect width="150" height="38" rx="19" fill="url(#emeraldGrad)" />
        <!-- LogIn Icon -->
        <path d="M875,35 L885,35 M881,30 L886,35 L881,40" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" transform="translate(-865, -16)" />
        <text x="36" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">লগইন করুন</text>
        <!-- Chevron -->
        <path d="M125,17 L130,22 L135,17" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>
    </g>
  </g>

  <!-- VARIANT 2 -->
  <g transform="translate(60, 295)" filter="url(#shadow)">
    <rect width="1080" height="150" rx="16" fill="url(#cardGrad)" />
    
    <!-- Variant Label -->
    <rect x="25" y="18" width="165" height="26" rx="6" fill="#f59e0b" fill-opacity="0.15" />
    <text x="35" y="36" font-family="sans-serif" font-size="12" font-weight="700" fill="#d97706">ডিজাইন ২: টু-টোন ক্যাপসুল ⭐</text>
    <text x="205" y="36" font-family="sans-serif" font-size="12" fill="#64748b">ফিনটেক স্টাইল: বামে গেস্ট স্ট্যাটাস, ডানে সরাসরি লগইন অ্যাকশন</text>

    <!-- Header Mockup Frame -->
    <g transform="translate(25, 55)">
      <rect width="1030" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      
      <!-- Brand Left -->
      <g transform="translate(16, 15)">
        <rect width="40" height="40" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
        <text x="10" y="27" font-size="20">🐔</text>
        <text x="50" y="20" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Smart Poultry</text>
        <rect x="155" y="8" width="55" height="18" rx="9" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1" />
        <text x="163" y="21" font-family="sans-serif" font-size="10" font-weight="600" fill="#047857">✓ সুরক্ষিত</text>
        <text x="50" y="36" font-family="sans-serif" font-size="11" fill="#64748b">আপনার খামারের হিসাব আজীবন নিরাপদ 🛡️</text>
      </g>

      <!-- Button Right (Variant 2: Two-Tone Capsule) -->
      <g transform="translate(845, 16)">
        <rect width="168" height="38" rx="19" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
        <!-- Guest Dot & Text -->
        <circle cx="16" cy="19" r="4" fill="#f59e0b" />
        <text x="26" y="23" font-family="sans-serif" font-size="12" font-weight="600" fill="#b45309">গেস্ট</text>
        <!-- Divider -->
        <line x1="68" y1="8" x2="68" y2="30" stroke="#cbd5e1" stroke-width="1" />
        <!-- Login Solid Pill inside -->
        <rect x="75" y="4" width="86" height="30" rx="15" fill="url(#emeraldGrad)" />
        <text x="90" y="23" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">লগইন</text>
        <path d="M135,17 L140,21 L145,17" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" fill="none" />
      </g>
    </g>
  </g>

  <!-- VARIANT 3 -->
  <g transform="translate(60, 470)" filter="url(#shadow)">
    <rect width="1080" height="150" rx="16" fill="url(#cardGrad)" />
    
    <!-- Variant Label -->
    <rect x="25" y="18" width="145" height="26" rx="6" fill="#6366f1" fill-opacity="0.15" />
    <text x="35" y="36" font-family="sans-serif" font-size="12" font-weight="700" fill="#4f46e5">ডিজাইন ৩: মিনিমাল অবতার</text>
    <text x="185" y="36" font-family="sans-serif" font-size="12" fill="#64748b">সবচেয়ে ছিমছাম: কোনো বাড়তি লেখা নেই, হেডারের পুরো জায়গা খোলামেলা থাকে</text>

    <!-- Header Mockup Frame -->
    <g transform="translate(25, 55)">
      <rect width="1030" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      
      <!-- Brand Left -->
      <g transform="translate(16, 15)">
        <rect width="40" height="40" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
        <text x="10" y="27" font-size="20">🐔</text>
        <text x="50" y="20" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Smart Poultry</text>
        <rect x="155" y="8" width="55" height="18" rx="9" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1" />
        <text x="163" y="21" font-family="sans-serif" font-size="10" font-weight="600" fill="#047857">✓ সুরক্ষিত</text>
        <text x="50" y="36" font-family="sans-serif" font-size="11" fill="#64748b">আপনার খামারের হিসাব আজীবন নিরাপদ 🛡️</text>
      </g>

      <!-- Button Right (Variant 3: Minimal Avatar with status dot) -->
      <g transform="translate(945, 14)">
        <rect width="68" height="42" rx="21" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
        <!-- Avatar circle -->
        <circle cx="24" cy="21" r="16" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
        <!-- User Icon -->
        <circle cx="24" cy="16" r="4.5" fill="#059669" />
        <path d="M16,28 C16,24 20,23 24,23 C28,23 32,24 32,28" fill="#059669" />
        <!-- Amber guest dot -->
        <circle cx="34" cy="28" r="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5" />
        <!-- Chevron -->
        <path d="M48,19 L52,23 L56,19" stroke="#64748b" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>
    </g>
  </g>

  <!-- VARIANT 4 -->
  <g transform="translate(60, 645)" filter="url(#shadow)">
    <rect width="1080" height="150" rx="16" fill="url(#cardGrad)" />
    
    <!-- Variant Label -->
    <rect x="25" y="18" width="145" height="26" rx="6" fill="#0ea5e9" fill-opacity="0.15" />
    <text x="35" y="36" font-family="sans-serif" font-size="12" font-weight="700" fill="#0284c7">ডিজাইন ৪: অ্যাকাউন্ট পিল</text>
    <text x="185" y="36" font-family="sans-serif" font-size="12" fill="#64748b">মার্জিত আউটলাইন বাটন: শুধু 'অ্যাকাউন্ট' লেখা, চাপলে ভেতরে সব অপশন আসে</text>

    <!-- Header Mockup Frame -->
    <g transform="translate(25, 55)">
      <rect width="1030" height="70" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
      
      <!-- Brand Left -->
      <g transform="translate(16, 15)">
        <rect width="40" height="40" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1" />
        <text x="10" y="27" font-size="20">🐔</text>
        <text x="50" y="20" font-family="sans-serif" font-size="16" font-weight="700" fill="#0f172a">Smart Poultry</text>
        <rect x="155" y="8" width="55" height="18" rx="9" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1" />
        <text x="163" y="21" font-family="sans-serif" font-size="10" font-weight="600" fill="#047857">✓ সুরক্ষিত</text>
        <text x="50" y="36" font-family="sans-serif" font-size="11" fill="#64748b">আপনার খামারের হিসাব আজীবন নিরাপদ 🛡️</text>
      </g>

      <!-- Button Right (Variant 4: Account Pill) -->
      <g transform="translate(865, 16)">
        <rect width="145" height="38" rx="19" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
        <!-- User Avatar Circle -->
        <circle cx="20" cy="19" r="11" fill="#ecfdf5" />
        <circle cx="20" cy="16" r="3.5" fill="#059669" />
        <path d="M14,25 C14,22 17,21 20,21 C23,21 26,22 26,25" fill="#059669" />
        <text x="40" y="24" font-family="sans-serif" font-size="13" font-weight="600" fill="#1e293b">অ্যাকাউন্ট</text>
        <path d="M118,17 L123,22 L128,17" stroke="#64748b" stroke-width="2" stroke-linecap="round" fill="none" />
      </g>
    </g>
  </g>
</svg>
