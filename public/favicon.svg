<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="farmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Rounded Green App Badge -->
  <rect width="64" height="64" rx="16" fill="url(#farmGrad)"/>
  
  <!-- Chicken Illustration -->
  <g filter="url(#shadow)">
    <!-- Red Comb -->
    <path d="M 27 15 C 24 10 32 8 33 13 C 35 9 43 11 41 16 C 44 14 47 18 43 21 Z" fill="#ef4444"/>
    
    <!-- White Chicken Head & Body -->
    <path d="M 22 47 C 20 35 24 23 35 21 C 44 21 48 27 48 37 C 48 46 41 49 32 49 C 26 49 23 48 22 47 Z" fill="#ffffff"/>
    
    <!-- Golden Beak -->
    <path d="M 46 29 L 54 33 L 46 37 Z" fill="#f59e0b"/>
    
    <!-- Red Wattle -->
    <path d="M 44 38 C 47 40 45 44 43 44 C 41 44 42 40 44 38 Z" fill="#ef4444"/>
    
    <!-- Eye with highlight -->
    <circle cx="39" cy="28" r="2.2" fill="#0f172a"/>
    <circle cx="39.7" cy="27.3" r="0.8" fill="#ffffff"/>
  </g>
</svg>
